services:
  pi:
    build: .
    container_name: pi-agent
    volumes:
      - .:/root/.pi/agent
    ports:
      - "4242:4242"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    stdin_open: true
    tty: true
    command: "" # Inherits ENTRYPOINT
